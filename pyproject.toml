[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "sdn-ctrlml-edge"
version = "0.1.0"
description = "Simulateur d'équilibrage de charge SDN décentralisé Cloud-Edge (EMA + K-means++)"
requires-python = ">=3.10"
dependencies = [
    "pandas>=2.0",
    "numpy>=1.24",
    "scikit-learn>=1.3",
    "networkx>=3.0",
    "matplotlib>=3.7",
    "seaborn>=0.12",
    "simpy>=4.0",
]

[project.optional-dependencies]
dev = ["pytest>=7.0"]

[tool.setuptools]
packages = ["sdn_ctrl_ml_edge", "sdn_ctrl_ml_edge.modeling"]
